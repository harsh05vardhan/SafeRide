# Base configuration shared by every profile. Profile-specific files
# (application-dev.yml, application-test.yml, application-prod.yml)
# override individual keys. Active profile is selected via
# SPRING_PROFILES_ACTIVE (defaults to "dev" for local development).
spring:
  application:
    name: saferide-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saferide?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:saferide}
    password: ${DB_PASSWORD:saferide}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SafeRideHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce connects lazily - the app still boots fine if Redis is briefly unreachable;
      # only whatever request actually needs it (matching, login rate limiting) fails, not startup.
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Dev-only fallback secret below is >= 256 bits, which HS256 requires - it is
    # NOT safe for anything beyond local development. Every real environment
    # MUST set JWT_SECRET explicitly (see .env.example / application-prod.yml).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  fare:
    # A fare adjustment is a config change here, not a code change - see FareCalculator.
    platform-fee: 10.0
    currency: INR
    vehicle-rates:
      mini:
        base-fare: 40.0
        per-km-rate: 12.0
        per-minute-rate: 1.5
      sedan:
        base-fare: 60.0
        per-km-rate: 15.0
        per-minute-rate: 2.0
      suv:
        base-fare: 80.0
        per-km-rate: 20.0
        per-minute-rate: 2.5
  matching:
    # Weights for DriverMatchScorer. Calibrated so a driver who is a bit further away
    # but meaningfully more reliable outscores the nearest-but-worse one - see
    # DriverMatchScorerTest for the exact worked example from the spec.
    distance-weight: 25.0
    rating-weight: 25.0
    reliability-weight: 20.0
    acceptance-weight: 10.0
    eta-weight: 20.0
    cancellation-penalty-weight: 30.0
    max-radius-km: 5.0
    max-eta-minutes: 15.0
    average-speed-kmh: 25.0
    # "redis" (default): DriverMatchingService gets candidates from a Redis geo-index -
    # see RedisDriverGeoIndex. "sql": falls back to the pre-Phase-11 full table scan
    # (SqlDriverGeoIndex) - what runs under the test profile, where Redis isn't available yet
    # (Testcontainers arrives Phase 14), and a legitimate no-Redis deployment option otherwise.
    geo-index-source: ${MATCHING_GEO_INDEX_SOURCE:redis}
  security:
    login-rate-limit:
      # Same redis/in-memory choice as matching's geo-index-source, same reason.
      source: ${LOGIN_RATE_LIMIT_SOURCE:redis}
      max-attempts: 10
      window-minutes: 15
  reliability:
    # Weights for ReliabilityCalculator - sum of the four positive weights is the
    # maximum possible score (100) before any cancellation/complaint penalty.
    rating-weight: 30.0
    acceptance-weight: 25.0
    completion-weight: 25.0
    on-time-weight: 20.0
    cancellation-penalty-weight: 30.0
    complaint-penalty-per-complaint: 5.0
    complaint-penalty-cap: 30.0
    # How much one new ride event shifts a rate (exponential moving average) - see DriverReliabilityService.
    ema-alpha: 0.2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
