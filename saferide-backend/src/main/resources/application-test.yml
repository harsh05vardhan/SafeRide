# Activated by @ActiveProfiles("test") on every test class. Real MySQL + real Redis (Phase 14,
# via Testcontainers) - not H2/SQL-fallback/in-memory stand-ins. spring.datasource.*,
# spring.data.redis.*, app.matching.geo-index-source and app.security.login-rate-limit.source are
# deliberately absent here: every @SpringBootTest either extends
# com.saferide.testsupport.AbstractIntegrationTest (the shared singleton MySQL+Redis containers) or,
# for the one test that needs its own isolated schema/Kafka broker, supplies its own
# @DynamicPropertySource - see KafkaEventForwarderTest. Running `mvn test` therefore requires Docker
# to be running.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  events:
    # No real Kafka broker in the main suite - KafkaEventForwarderTest re-enables this for itself
    # against a real @EmbeddedKafka broker. In-app notifications are unaffected either way
    # (NotificationEventListener needs no Kafka - see application.yml's comment).
    kafka-forwarding-enabled: false

logging:
  level:
    root: WARN
    com.saferide: INFO
