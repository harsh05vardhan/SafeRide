# Serves the Vite production build (Phase 15). Client-side routing (React Router) means every
# path that isn't a real static file must still resolve to index.html - the SPA's own router
# decides what to render from there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html references the current deploy's hashed asset filenames - unlike those
        # (below), it must never be cached, or a browser can get stuck pinned to a deploy that's
        # already been replaced (an old index.html referencing JS/CSS files that no longer exist
        # on the server once the next deploy overwrites this directory).
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every filename in assets/ (content hash in the name), so these can be
    # cached aggressively - a new deploy always ships new filenames, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
