name: CD

# Publishes container images to GHCR (Phase 16) - deploying that image anywhere is Phase 17's
# job, not this one. GHCR rather than Docker Hub deliberately: it authenticates with the
# workflow's own automatic GITHUB_TOKEN, so this needs zero secrets configured by hand.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  # Never cancel a run that might already be mid-push to the registry - a half-pushed image
  # tagged :latest is worse than a slightly-delayed correct one.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Repeated rather than shared with ci.yml on purpose - CD can't assume CI already ran for
  # this exact commit (workflow_dispatch, or a push landing before CI finishes), and a failing
  # test must never let an image reach the registry.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: saferide-backend/pom.xml
      - name: Backend tests
        working-directory: saferide-backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: saferide-frontend/package-lock.json
      - name: Frontend install
        working-directory: saferide-frontend
        run: npm ci
      - name: Frontend lint
        working-directory: saferide-frontend
        run: npm run lint
      - name: Frontend test
        working-directory: saferide-frontend
        run: npm test

  publish:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path; github.repository_owner isn't guaranteed to be
      # (an org/user name can contain uppercase letters).
      - name: Compute lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./saferide-backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/saferide-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/saferide-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # VITE_API_BASE_URL/VITE_WS_BASE_URL are baked in at build time (see the frontend
      # Dockerfile's own comment on why) - override via repo Variables once Phase 17 picks a
      # real hosting target; these defaults match every other environment's own default.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./saferide-frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL || 'ws://localhost:8080/ws' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/saferide-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/saferide-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
